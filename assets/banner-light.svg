<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="Skylor Tang — Backend Engineer · AI Agent Tooling">
  <title>Skylor Tang — Backend Engineer · AI Agent Tooling</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color='#FBFCFF'/><stop offset='0.55' stop-color='#F5F7FE'/><stop offset='1' stop-color='#EEF2FF'/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 30) scale(440 330)">
      <stop stop-color="#818CF8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 320) scale(480 310)">
      <stop stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="60" y1="118" x2="640" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="rule" x1="60" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#0F172A" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
    <clipPath id="tw"><rect x="58" y="246" width="0" height="26"><animate attributeName="width" values="0;8;17;25;34;42;50;59;67;76;84;92;101;109;118;126;134;143;151;160;168;176;185;193;202;210;218;227;235;244;252;260;269;277;286;294;302;311;319;328;336;344;353;361;370;378;386;395;403;412;420;428;437;445;453" dur="1.5s" begin="1.0s" calcMode="discrete" fill="freeze"/></rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <g>
      <animate attributeName="opacity" values="0.62;1;0.62" dur="9s" repeatCount="indefinite"/>
      <rect width="1200" height="340" fill="url(#glowA)"/>
      <rect width="1200" height="340" fill="url(#glowB)"/>
    </g>

    <!-- drifting embers -->
    <g fill="#6366F1" fill-opacity="0.45">
      <circle cx="690" cy="300" r="2.5">
        <animate attributeName="cy" values="300;262;300" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="646" cy="120" r="1.8">
        <animate attributeName="cy" values="120;86;120" dur="17s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="716" cy="212" r="1.5">
        <animate attributeName="cy" values="212;180;212" dur="15s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="15s" begin="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.05s" fill="freeze"/>
        <text x="60" y="80" fill="#0891B2" font-size="13" letter-spacing="4.4">// BACKEND · AI AGENT TOOLING</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.15s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 12;0 0" dur="0.7s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
        <text x="58" y="162" fill="url(#nameFill)" font-size="58" font-weight="700" letter-spacing="-1">Skylor Tang</text>
      </g>

      <rect x="60" y="190" width="0" height="2" fill="url(#rule)">
        <animate attributeName="width" values="0;340" dur="0.8s" begin="0.35s" fill="freeze"/>
      </rect>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, Helvetica, Arial, sans-serif">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
        <text x="60" y="228" fill="#475569" font-size="18" letter-spacing="0.6">喜欢把复杂的系统，做成简单的东西。</text>
      </g>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" clip-path="url(#tw)">
      <text x="60" y="264" fill="#64748B" font-size="14" letter-spacing="0.2">python · go · typescript · django · fastapi · docker</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1" dur="2.5s" begin="0s" fill="freeze"/>
      <rect x="513" y="251" width="7" height="16" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- terminal card -->
    <g transform="translate(744 50)">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.55s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.6s" begin="0.55s" fill="freeze"/>
        <rect width="396" height="240" rx="14" fill="#0F172A" fill-opacity="1" stroke="#0F172A" stroke-opacity="0.14"/>
        <path d="M0 14a14 14 0 0 1 14-14h368a14 14 0 0 1 14 14v18H0V14Z" fill="#0F172A" fill-opacity="0.06"/>
        <circle cx="21" cy="16" r="4" fill="#F87171" fill-opacity="0.9"/>
        <circle cx="37" cy="16" r="4" fill="#FBBF24" fill-opacity="0.9"/>
        <circle cx="53" cy="16" r="4" fill="#34D399" fill-opacity="0.9"/>
        <text x="76" y="21" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#E2E8F0" fill-opacity="0.45">~/skylor — zsh</text>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.90s" fill="freeze"/>
        <text x="22" y="80" fill="#6EE7B7" font-size="13.5">$ whoami</text>
        <text x="22" y="102" fill="#E2E8F0" font-size="13.5">skylor — backend @ Shanghai</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.32s" fill="freeze"/>
        <text x="22" y="140" fill="#6EE7B7" font-size="13.5">$ now</text>
        <text x="22" y="162" fill="#E2E8F0" font-size="13.5">agent tooling &amp; local-first apps</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.74s" fill="freeze"/>
        <text x="22" y="200" fill="#6EE7B7" font-size="13.5">$ status</text>
        <text x="22" y="222" fill="#E2E8F0" font-size="13.5">open to interesting problems</text>
      </g>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1" dur="2.5s" begin="0s" fill="freeze"/>
        <rect x="254" y="211" width="8" height="15" fill="#22D3EE">
          <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="22" stroke="#0F172A" stroke-opacity="0.10"/>
</svg>
