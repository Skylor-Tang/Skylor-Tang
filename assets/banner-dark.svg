<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Skylor Tang — Backend engineer, AI agent tooling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#0D1224"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 40) scale(420 320)">
      <stop stop-color="#6366F1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 300) scale(460 300)">
      <stop stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="64" y1="120" x2="620" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="rule" x1="64" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>

    <!-- left: identity -->
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
      <text x="64" y="86" fill="#22D3EE" font-size="14" letter-spacing="4.5">// BACKEND · AI AGENT TOOLING</text>
      <text x="62" y="164" fill="url(#nameFill)" font-size="58" font-weight="700" letter-spacing="-1">Skylor Tang</text>
      <rect x="64" y="192" width="360" height="2" fill="url(#rule)"/>
      <text x="64" y="232" fill="#94A3B8" font-size="17" letter-spacing="0.6">喜欢把复杂的系统，做成简单的东西。</text>
      <text x="64" y="266" fill="#64748B" font-size="15" letter-spacing="0.6">Python / Go / TypeScript · Django &amp; FastAPI · 本地优先的工程工具</text>
    </g>

    <!-- right: terminal card -->
    <g transform="translate(760 62)">
      <rect width="380" height="196" rx="14" fill="#0A0E1A" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect x="1" y="1" width="378" height="30" rx="13" fill="#FFFFFF" fill-opacity="0.045"/>
      <circle cx="20" cy="16" r="4" fill="#F87171" fill-opacity="0.9"/>
      <circle cx="36" cy="16" r="4" fill="#FBBF24" fill-opacity="0.9"/>
      <circle cx="52" cy="16" r="4" fill="#34D399" fill-opacity="0.9"/>
      <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5">
        <text x="20" y="66" fill="#6EE7B7">$ whoami</text>
        <text x="20" y="90" fill="#E2E8F0">skylor — backend @ Shanghai</text>
        <text x="20" y="120" fill="#6EE7B7">$ now</text>
        <text x="20" y="144" fill="#E2E8F0">building agent infra for devs</text>
        <text x="20" y="174" fill="#6EE7B7">$<tspan fill="#A5B4FC"> shipping since 2016 <tspan fill="#22D3EE">▍</tspan></tspan></text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
